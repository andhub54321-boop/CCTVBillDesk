<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#153e75">
  <meta name="description" content="CCTV BillDesk - Offline Invoice Management & Price Configurator App">
  <title>CCTV BillDesk</title>

  <!-- App Favicon & PWA Manifest -->
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
  <link rel="shortcut icon" type="image/x-icon" href="./favicon.ico">
  <link rel="apple-touch-icon" href="./icon.ico">
  <link rel="manifest" href="./manifest.webmanifest">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f5ff',
              100: '#e0ecff',
              200: '#bae0ff',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#153e75',
              900: '#0c2447',
              950: '#07162c'
            }
          },
          fontFamily: {
            cinzel: ['Cinzel', 'serif'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'Roboto Mono', 'monospace']
          },
          animation: {
            'fade-in': 'fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'scale-up': 'scaleUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'ambient-drift': 'ambientDrift 18s ease-in-out infinite alternate',
            'float-glow': 'floatGlow 10s ease-in-out infinite alternate',
            'slide-in-right': 'slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards'
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(8px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' }
            },
            scaleUp: {
              '0%': { opacity: '0', transform: 'scale(0.95)' },
              '100%': { opacity: '1', transform: 'scale(1)' }
            },
            ambientDrift: {
              '0%': { transform: 'translate(0px, 0px) scale(1)' },
              '50%': { transform: 'translate(40px, -30px) scale(1.08)' },
              '100%': { transform: 'translate(-30px, 35px) scale(0.95)' }
            },
            floatGlow: {
              '0%': { opacity: '0.35', transform: 'scale(0.95)' },
              '100%': { opacity: '0.65', transform: 'scale(1.12)' }
            },
            slideInRight: {
              '0%': { transform: 'translateX(100%)', opacity: '0' },
              '100%': { transform: 'translateX(0)', opacity: '1' }
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts & Material Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <style>
    /* Ultra-Smooth Ambient Aurora Background */
    .aurora-bg {
      background: radial-gradient(ellipse 90% 70% at 15% 15%, rgba(21, 62, 117, 0.65) 0%, transparent 60%),
                  radial-gradient(ellipse 70% 60% at 85% 85%, rgba(16, 185, 129, 0.35) 0%, transparent 55%),
                  radial-gradient(ellipse 80% 60% at 65% 20%, rgba(99, 102, 241, 0.35) 0%, transparent 50%),
                  radial-gradient(circle at 50% 50%, rgba(30, 41, 59, 1) 0%, #070d18 100%);
      background-attachment: fixed;
    }

    /* Glassmorphism Panel Tokens */
    .glass-card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 16px 36px -10px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.2) inset;
    }

    .glass-card-dark {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Interactive Soft Glows */
    .hover-glow {
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .hover-glow:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px -6px rgba(21, 62, 117, 0.25), 0 0 0 1px rgba(37, 99, 235, 0.3);
    }

    /* Exact Screen A4 Dimensions */
    .a4-sheet {
      width: 210mm;
      min-height: 297mm;
    }

    .brand-title {
      font-family: 'Cinzel', serif;
      letter-spacing: 0.12em;
    }

    /* Custom Modern Slim Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.4);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.35);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.65);
    }

    /* Responsive Mobile Sheet Pan Viewport */
    @media (max-width: 1024px) {
      .sheet-scroller {
        width: 100%;
        overflow-x: auto;
        padding-bottom: 28px;
        -webkit-overflow-scrolling: touch;
      }
    }

    /* =========================================================
       PRINT / PDF SPECIFICATIONS (STRICT A4 PORTRAIT DEFAULT 1:1)
       ========================================================= */
    @page {
      size: A4 portrait;
      margin: 8mm 10mm;
    }

    @media print {
      html, body {
        width: 210mm;
        height: 297mm;
        background: #ffffff !important;
        padding: 0 !important;
        margin: 0 !important;
        color: #000000 !important;
      }

      .no-print,
      .col-actions,
      th.col-actions,
      td.col-actions,
      .qty-btn,
      .upload-trigger,
      .remove-asset-btn,
      .aurora-orb {
        display: none !important;
      }

      .app-layout {
        display: block !important;
        padding: 0 !important;
        margin: 0 !important;
      }

      .sheet-scroller {
        overflow: visible !important;
        padding: 0 !important;
      }

      .a4-sheet {
        width: 100% !important;
        box-shadow: none !important;
        border: 1.5px solid #000000 !important;
        padding: 0 !important;
        margin: 0 !important;
        page-break-after: avoid;
        page-break-inside: avoid;
      }

      .editable-field {
        border: none !important;
        background: transparent !important;
        padding: 0 !important;
        color: #000000 !important;
      }

      .rate-display {
        border: none !important;
        cursor: default !important;
      }

      table, thead th, tbody td, .totals-table td, .invoice-footer, .meta-grid {
        border-color: #000000 !important;
      }

      .invoice-banner {
        background-color: #e2e8f0 !important;
        color: #000000 !important;
        border-top: 1.5px solid #000000 !important;
        border-bottom: 1.5px solid #000000 !important;
      }

      thead th {
        background-color: #f1f5f9 !important;
      }
    }
  </style>
  <script type="module" crossorigin src="./assets/index-Ca-5kkED.js"></script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
